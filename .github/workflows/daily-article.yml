# 毎朝の自動記事生成：記事を書く → サムネを作る → 機械チェック → プルリクエストを出す。
# 公開してよいかは、Hiro がプルリクエストをマージするかどうかで決まる（main には直接 push しない）。
# 毎朝 JST 4:07 ごろ（cron は UTC なので、前日の UTC 19:07）に自動実行する。毎時0分は混み合って実行が抜けることがあるため、7分ずらしている。手動実行（workflow_dispatch）もできる。
# GitHub のスケジュール実行は、混雑時に数分〜数十分遅れることがある。
# 公開リポジトリでは、60日間リポジトリに動きがないと、スケジュール実行が自動で止まる（毎朝 PR が出ていれば通常は問題ない）。
name: Daily article

on:
  workflow_dispatch:
    inputs:
      count:
        description: "作る記事の本数"
        default: "1"
      hint:
        description: "区やテーマの指定（任意。例: 世田谷区、グルメ。空なら重点3区から自動で選ぶ）"
        default: ""
  schedule:
    - cron: "7 19 * * *"

permissions:
  contents: write        # ブランチを push する
  pull-requests: write   # プルリクエストを作る
  id-token: write        # claude-code-action が要求する

concurrency:
  group: daily-article
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

defaults:
  run:
    shell: bash

jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare
        id: prep
        run: |
          mkdir -p .work/thumbnails
          echo "today=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "now=$(date '+%Y-%m-%d %H:%M (JST)')" >> "$GITHUB_OUTPUT"

      # 指定がなければ、重点エリア（hugo.toml の priorityWards）から、記事がいちばん古い区を優先する指定を作る。
      - name: Pick ward
        id: ward
        env:
          HINT: ${{ inputs.hint }}
        run: |
          if [ -n "$HINT" ]; then hint="$HINT"; else hint=$(python3 scripts/pick_ward.py); fi
          # 改行は除く（出力に別の値が混ざらないように）
          hint=$(printf '%s' "$hint" | tr '\r\n' '  ')
          echo "hint=$hint" >> "$GITHUB_OUTPUT"
          echo "区やテーマの指定: $hint" >> "$GITHUB_STEP_SUMMARY"

      # 記事を書く。ANTHROPIC_API_KEY はこの工程にだけ渡す。
      # 使えるツールは、Web 検索・取得と、決まった場所へのファイル書き込みだけ（Bash なし）。
      # show_full_output は使わない（公開リポジトリでは、ログに出たものが誰にでも見えるため）。
      - name: Write article
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            `.github/daily-article-task.md` を読み、その指示どおりに記事を作ってください。
            - 今日の日付と時刻: ${{ steps.prep.outputs.now }}（日付は ${{ steps.prep.outputs.today }}）
            - 作る記事の本数: ${{ inputs.count || '1' }}
            - 区やテーマの指定: ${{ steps.ward.outputs.hint }}
          claude_args: >-
            --model ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 80
            --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Write(content/posts/**),Edit(content/posts/**),Write(.work/**),Edit(.work/**),Edit(data/published-topics.json)"

      - name: Check result
        id: result
        run: |
          if [ ! -f .work/result.json ]; then
            echo "::error::記事生成の結果（.work/result.json）がありません"; exit 1
          fi
          n=$(python3 -c "import json;print(len(json.load(open('.work/result.json')).get('articles',[])))")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" = "0" ]; then
            reason=$(python3 -c "import json;print(json.load(open('.work/result.json')).get('skipped_reason',''))")
            { echo "### 今日は記事を作りませんでした"; echo; echo "$reason"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 記事の date / lastmod は、AI に任せず、作成した日時に上書きする（未来の日時だと公開されないため）。
      # 失敗しても PR は出す（機械チェックと、PR の確認で気づける）。
      - name: Set post date
        if: steps.result.outputs.count != '0'
        run: |
          dirs=$(python3 -c "import json;print(' '.join('content/posts/'+a['slug'] for a in json.load(open('.work/result.json'))['articles']))")
          python3 scripts/set_post_date.py $dirs || true

      # サムネを作る。GEMINI_API_KEY / GEMINI_IMAGE_MODEL はこの工程にだけ渡す。
      # 失敗しても、記事だけのプルリクエストは出す（PR 本文に「画像なし」と書く）。
      - name: Generate thumbnails
        if: steps.result.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
        run: |
          for slug in $(python3 -c "import json;print(' '.join(a['slug'] for a in json.load(open('.work/result.json'))['articles']))"); do
            python scripts/generate_thumbnail.py ".work/thumbnails/${slug}.yaml" \
              || echo "::warning::サムネの生成に失敗しました: ${slug}"
          done

      - name: Validate
        if: steps.result.outputs.count != '0'
        run: |
          dirs=$(python3 -c "import json;print(' '.join('content/posts/'+a['slug'] for a in json.load(open('.work/result.json'))['articles']))")
          python scripts/validate_post.py --allow-missing-image --json $dirs > .work/validate.json || true
          python scripts/validate_post.py --allow-missing-image $dirs || true

      - name: Build PR text
        if: steps.result.outputs.count != '0'
        run: python scripts/build_pr.py

      - name: Create pull request
        if: steps.result.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="daily/${{ steps.prep.outputs.today }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/posts data/published-topics.json
          git commit -m "$(cat .work/pr-title.txt)"
          git push origin "$branch"
          draft=""
          [ -f .work/pr-has-errors ] && draft="--draft"
          gh pr create --base main --head "$branch" $draft \
            --title "$(cat .work/pr-title.txt)" --body-file .work/pr-body.md
