# main へのマージで Hugo をビルドし、GitHub Pages に公開する。
# プルリクエストでは、ビルドが通るかの確認だけを行う（公開はしない）。
# 毎朝 JST 7:05（UTC 22:05）にもビルドし直す。Hugo は未来の日時の記事をビルドしないため、
# 先にマージしておいた記事が、公開日時（例: 7:00）を過ぎたあとに公開される。
# 毎時0分は混み合って実行が抜けることがあるので、5分ずらしている。抜けたときは手動実行（workflow_dispatch）。
name: Build and deploy

env:
  # compose.yaml の HUGO_VERSION（v0.170.1）と必ず揃える
  HUGO_VERSION: 0.170.1
  TZ: Asia/Tokyo

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install Hugo (extended)
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log Hugo version
        run: hugo version

      # baseURL は hugo.toml（https://tokyo-update.com/）をそのまま使う。下書きは含まれない。
      - name: Build
        run: hugo build --gc --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
