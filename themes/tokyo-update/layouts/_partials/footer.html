<footer class="site-footer">
  <div class="container">
    <p class="footer-lead">{{ site.Params.description }}</p>
    <p class="footer-about">{{ site.Params.about }}</p>
    <nav class="footer-nav"><a href="{{ "/posts/" | relURL }}">記事一覧</a><a href="{{ "/ward/" | relURL }}">区から探す</a><a href="{{ "/index.xml" | relURL }}">RSS</a><a href="{{ "/plan/" | relURL }}">記事掲載・PR</a><a href="https://company.p1st.app/terms/" target="_blank" rel="noopener">利用規約</a><a href="https://company.p1st.app/privacy/" target="_blank" rel="noopener">プライバシーポリシー</a><a href="https://company.p1st.app/tokushoho/" target="_blank" rel="noopener">特定商取引法に基づく表記</a></nav>
    <p class="footer-x"><a class="x-follow" href="{{ site.Params.xURL }}" target="_blank" rel="noopener"><span aria-hidden="true">𝕏</span> {{ site.Params.xHandle }} をフォロー</a></p>
    <div class="footer-notes">
      <p>{{ site.Params.supervisionNote }}</p>
      <p>{{ site.Params.disclaimerNote }}</p>
    </div>
    <p class="footer-operator">運営者: <a href="{{ site.Params.operatorURL }}" target="_blank" rel="noopener">{{ site.Params.operatorName }}</a></p>
    <p class="copy">© {{ now.Year }} {{ site.Title }}</p>
  </div>
</footer>
